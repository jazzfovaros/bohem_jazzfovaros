# Netlify Next.js plugin által kezelt deploy (publish könyvtárat nem adunk meg).
# Két külön Netlify site, ugyanabból a repóból (buildkor a Netlify URL alapján választ nyelvet: buildLocale.ts).
# Opcionális: NEXT_PUBLIC_LOCALE=en|hu — egyedi domainnál, ha az URL nem egyezik a SITE_URL_* hosttal.

[build]
  command = "npm run build"

[[plugins]]
  package = "@netlify/plugin-nextjs"

[build.environment]
  NODE_VERSION = "20"
  # NEXT_PUBLIC_LOCALE=hu makes the HU build explicit so URL-based detection is not needed.
  # The EN Netlify site must override this with NEXT_PUBLIC_LOCALE=en in its dashboard.
  NEXT_PUBLIC_LOCALE = "hu"
  # FONTOS: ezek adják a canonical / hreflang / sitemap URL-eket. Amíg itt (vagy a
  # Netlify dashboardon) a staging domain szerepelt, az éles jazzfovaros.hu
  # `<link rel="canonical" href="https://bohemjazz.netlify.app/">`-t küldött, így a
  # keresők a staging site-ot crawlolták — dupla Function/Edge használat két site-on.
  # Egy domain + /en path-prefix, ezért HU és EN ugyanaz a host.
  NEXT_PUBLIC_SITE_URL_HU = "https://jazzfovaros.hu"
  NEXT_PUBLIC_SITE_URL_EN = "https://jazzfovaros.hu"
  NEXT_PUBLIC_GA4_ID = "G-Y9BMR7XZK6"
  # Public Sanity client config (required at Next.js build time). Read/write tokens → Netlify dashboard only.
  NEXT_PUBLIC_SANITY_PROJECT_ID = "ajkz39i8"
  NEXT_PUBLIC_SANITY_DATASET = "production"
  NEXT_PUBLIC_SANITY_API_VERSION = "2026-01-01"
  SECRETS_SCAN_OMIT_KEYS = "NEXT_PUBLIC_SANITY_DATASET,NEXT_PUBLIC_SANITY_API_VERSION,NEXT_PUBLIC_SANITY_PROJECT_ID"

# ---------------------------------------------------------------------------
# Statikus asset cache
#
# A Netlify alapértelmezése a public/ fájlokra `public,max-age=0,must-revalidate`,
# vagyis a böngésző MINDEN oldalletöltésnél újra elküld egy feltételes kérést a
# többmegabájtos háttérképekre is. A `stale-while-revalidate` ablakkal a
# visszatérő látogató azonnal a cache-ből kapja a képet, a frissítés a háttérben
# történik — így egy háttérkép cseréje is legfeljebb egy napon belül átmegy.
# ---------------------------------------------------------------------------

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=86400, stale-while-revalidate=2592000"

[[headers]]
  for = "/documents/*"
  [headers.values]
    Cache-Control = "public, max-age=86400, stale-while-revalidate=2592000"

[[headers]]
  for = "/favicon.png"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/site.webmanifest"
  [headers.values]
    Cache-Control = "public, max-age=604800"
